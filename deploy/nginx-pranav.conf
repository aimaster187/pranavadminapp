limit_req_zone $binary_remote_addr zone=pranav_api_limit:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __PRANAV_DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __PRANAV_DOMAIN__;

    # Provisioned by Certbot
    ssl_certificate /etc/letsencrypt/live/__PRANAV_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__PRANAV_DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 5m;

    location / {
        limit_req zone=pranav_api_limit burst=60 nodelay;
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

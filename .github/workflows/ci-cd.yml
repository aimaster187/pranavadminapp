name: PRANAV Ecosystem CI/CD (5 Independent Artifacts)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. PRANAV Backend + RANGIN Telegram Multi-Bot Engine
  backend-and-bots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm --prefix backend ci
      - name: TypeScript build
        run: npm --prefix backend run build
      - name: Run full backend & RANGIN test suite
        run: npm --prefix backend test
      - name: Upload PRANAV Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pranav-backend-release
          path: |
            backend/dist/
            backend/package.json
            backend/package-lock.json
            deploy/

  # 2. PRANAV Android Admin Application (:app)
  android-admin-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Admin App Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Decode Release Keystore (if configured in GitHub Secrets)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > my-upload-key.jks
      - name: Build Android Admin APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f my-upload-key.jks ]; then
            ./gradlew :app:assembleRelease --no-daemon
          else
            ./gradlew :app:assembleDebug --no-daemon
          fi
      - name: Upload PRANAV Admin App APK
        uses: actions/upload-artifact@v4
        with:
          name: pranav-admin-apk
          path: app/build/outputs/apk/**/*.apk

  # 3. PRANAV Android SDK (:pranav-sdk)
  pranav-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and assemble PRANAV SDK AAR
        run: ./gradlew :pranav-sdk:testDebugUnitTest :pranav-sdk:assembleRelease --no-daemon
      - name: Upload PRANAV SDK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pranav-sdk-aar
          path: pranav-sdk/build/outputs/aar/*-release.aar

  # 4. Standalone PRANAV.dex Deliverable (NEVER a DEX APK)
  pranav-dex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Run PRANAV.dex contract tests
        run: ./gradlew :pranav-dex:testDebugUnitTest --no-daemon
      - name: Build standalone PRANAV.dex + SHA-256 manifest
        run: bash pranav-dex/scripts/build-dex.sh
      - name: Verify PRANAV.dex is standalone (not an APK)
        run: |
          test -f pranav-dex/dist/PRANAV.dex
          sha256sum -c pranav-dex/dist/PRANAV.dex.sha256
          grep -q '"isApk": false' pranav-dex/dist/dex-manifest.json
      - name: Upload Standalone PRANAV.dex Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pranav-standalone-dex
          path: |
            pranav-dex/dist/PRANAV.dex
            pranav-dex/dist/PRANAV.dex.sha256
            pranav-dex/dist/dex-manifest.json

  # 5. Standalone PRANAV Hook Integration Package (:pranav-hook)
  pranav-hook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and assemble PRANAV Hook AAR
        run: ./gradlew :pranav-hook:testDebugUnitTest :pranav-hook:assembleRelease --no-daemon
      - name: Upload PRANAV Hook Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pranav-hook-aar
          path: pranav-hook/build/outputs/aar/*-release.aar

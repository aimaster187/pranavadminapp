name: PRANAV Ecosystem CI/CD (5 Independent Artifacts)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. PRANAV Backend + RANGIN Telegram Multi-Bot Engine
  backend-and-bots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm --prefix backend ci
      - name: TypeScript build
        run: npm --prefix backend run build
      - name: Run full backend & RANGIN test suite
        run: npm --prefix backend test
      - name: Upload PRANAV Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pranav-backend-release
          path: |
            backend/dist/
            backend/package.json
            backend/package-lock.json
            deploy/

  # 2. PRANAV Android Admin Application (:app)
  android-admin-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-9.3.1-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-9.3.1-${{ runner.os }}-
      - name: Setup Gradle 9.3.1 and Android SDK 36.1
        run: |
          if ! gradle --version 2>/dev/null | grep -q "Gradle 9.3.1"; then
            curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle-9.3.1.zip
            unzip -q -o /tmp/gradle-9.3.1.zip -d /tmp/gradle-dist
            echo "/tmp/gradle-dist/gradle-9.3.1/bin" >> "$GITHUB_PATH"
          fi
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            mkdir -p "$SDK_ROOT/cmdline-tools/tmp"
            unzip -q -o /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools/tmp"
            mv "$SDK_ROOT/cmdline-tools/tmp/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            rm -rf "$SDK_ROOT/cmdline-tools/tmp"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "build-tools;36.0.0" "platforms;android-36" "platforms;android-36.1"
      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Run Admin App Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build Android Admin APK (Release if signing secrets configured, else Debug)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
            gradle :app:assembleRelease --no-daemon
            rm -f "$KEYSTORE_PATH"
          else
            gradle :app:assembleDebug --no-daemon
          fi
      - name: Upload PRANAV Admin App APK
        uses: actions/upload-artifact@v4
        with:
          name: pranav-admin-apk
          path: app/build/outputs/apk/**/*.apk

  # 3. PRANAV Android SDK (:pranav-sdk) & Sample Host App (:sample-host-app)
  pranav-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-9.3.1-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-9.3.1-${{ runner.os }}-
      - name: Setup Gradle 9.3.1 and Android SDK 36.1
        run: |
          if ! gradle --version 2>/dev/null | grep -q "Gradle 9.3.1"; then
            curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle-9.3.1.zip
            unzip -q -o /tmp/gradle-9.3.1.zip -d /tmp/gradle-dist
            echo "/tmp/gradle-dist/gradle-9.3.1/bin" >> "$GITHUB_PATH"
          fi
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            mkdir -p "$SDK_ROOT/cmdline-tools/tmp"
            unzip -q -o /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools/tmp"
            mv "$SDK_ROOT/cmdline-tools/tmp/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            rm -rf "$SDK_ROOT/cmdline-tools/tmp"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "build-tools;36.0.0" "platforms;android-36" "platforms;android-36.1"
      - name: Test and assemble PRANAV SDK AAR & Sample Host Debug APK
        run: gradle :pranav-sdk:testDebugUnitTest :pranav-sdk:assembleRelease :sample-host-app:assembleDebug --no-daemon
      - name: Upload PRANAV SDK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pranav-sdk-aar
          path: |
            pranav-sdk/build/outputs/aar/*-release.aar
            sample-host-app/build/outputs/apk/debug/*.apk

  # 4. Standalone PRANAV.dex Deliverable (NEVER a DEX APK)
  pranav-dex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-9.3.1-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-9.3.1-${{ runner.os }}-
      - name: Setup Gradle 9.3.1 and Android SDK 36.1
        run: |
          if ! gradle --version 2>/dev/null | grep -q "Gradle 9.3.1"; then
            curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle-9.3.1.zip
            unzip -q -o /tmp/gradle-9.3.1.zip -d /tmp/gradle-dist
            echo "/tmp/gradle-dist/gradle-9.3.1/bin" >> "$GITHUB_PATH"
          fi
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            mkdir -p "$SDK_ROOT/cmdline-tools/tmp"
            unzip -q -o /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools/tmp"
            mv "$SDK_ROOT/cmdline-tools/tmp/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            rm -rf "$SDK_ROOT/cmdline-tools/tmp"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "build-tools;36.0.0" "platforms;android-36" "platforms;android-36.1"
      - name: Run PRANAV.dex contract tests
        run: gradle :pranav-dex:testDebugUnitTest --no-daemon
      - name: Build standalone PRANAV.dex + SHA-256 manifest
        run: bash pranav-dex/scripts/build-dex.sh
      - name: Verify PRANAV.dex is standalone (not an APK)
        run: |
          test -f pranav-dex/dist/PRANAV.dex
          (cd pranav-dex/dist && sha256sum -c PRANAV.dex.sha256)
          grep -q '"isApk": false' pranav-dex/dist/dex-manifest.json
      - name: Upload Standalone PRANAV.dex Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pranav-standalone-dex
          path: |
            pranav-dex/dist/PRANAV.dex
            pranav-dex/dist/PRANAV.dex.sha256
            pranav-dex/dist/dex-manifest.json

  # 5. Standalone PRANAV Hook Integration Package (:pranav-hook)
  pranav-hook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-9.3.1-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-9.3.1-${{ runner.os }}-
      - name: Setup Gradle 9.3.1 and Android SDK 36.1
        run: |
          if ! gradle --version 2>/dev/null | grep -q "Gradle 9.3.1"; then
            curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle-9.3.1.zip
            unzip -q -o /tmp/gradle-9.3.1.zip -d /tmp/gradle-dist
            echo "/tmp/gradle-dist/gradle-9.3.1/bin" >> "$GITHUB_PATH"
          fi
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            mkdir -p "$SDK_ROOT/cmdline-tools/tmp"
            unzip -q -o /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools/tmp"
            mv "$SDK_ROOT/cmdline-tools/tmp/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            rm -rf "$SDK_ROOT/cmdline-tools/tmp"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "build-tools;36.0.0" "platforms;android-36" "platforms;android-36.1"
      - name: Test and assemble PRANAV Hook AAR
        run: gradle :pranav-hook:testDebugUnitTest :pranav-hook:assembleRelease --no-daemon
      - name: Upload PRANAV Hook Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pranav-hook-aar
          path: pranav-hook/build/outputs/aar/*-release.aar
